[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI (`peaky` is taken). The IMPORT package + CLI stay
# `peaky` (dist != import, like scikit-learn/sklearn): `pip install mascope-peaky`
# then `import peaky` / run `peaky`.
name = "mascope-peaky"
version = "0.9.0"
description = "Peaky — AI-native analysis toolbox for Mascope: reproducible CIMS peak assignment, clustering, and reporting."
readme = "README.md"
requires-python = ">=3.12"  # mascope-tools (core dep) requires >=3.12
authors = [{ name = "Aleksei Scherbinin" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["peaky", "mass-spectrometry", "CIMS", "peak-assignment", "van-krevelen", "mascope", "kendrick"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    # Keep at the LATEST release. peaky/io tracks the SDK's unified name-matching
    # contract (raw names match as literal substrings; only a compiled re.Pattern
    # is a regex) -- 2026.8.12 is the release that unified it. When the SDK moves,
    # upgrade and run tests/test_io_mascope.py rather than pinning back.
    "mascope-sdk>=2026.8.12",
    # In-process scoring backend, now the DEFAULT (PEAKY_LOCAL_SCORING=0 falls back
    # to the network match_compounds path). See docs/MASCOPE_TOOLS_INTEGRATION.md.
    # 2026.9.30, the library Mascope 1.10 publishes, is the release that carries
    # what the scorer is built on: PatternScoring, the mass-accuracy fit, the
    # instrument-class widths and the standard adduct notation the mechanisms
    # are spelled in (2026.6.25 brought the 15N-labelled custom-element isotope
    # prediction). A server of that release also sends each peak's
    # signal_to_noise; an older one does not, and the score runs in its no-SNR
    # mode against it.
    "mascope-tools>=2026.9.30",
    "pandas>=2.1",
    "pyarrow>=14",          # parquet engine — the per-batch TS (*_ts.parquet) is read/written across the pipeline
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# `pip install mascope-peaky[compress]` enables the size-reduced companion PDF
# (pdf_report.compress_pdf). Absent these, the report still builds; only the
# `_compressed.pdf` is skipped.
compress = ["PyMuPDF>=1.23", "Pillow>=9.0"]
# `pip install mascope-peaky[mcp]` enables the MCP server (`peaky mcp`) so any
# MCP client (ChatGPT Developer Mode, Claude Desktop, Cursor) can drive peaky.
# Absent this, the core CLI/pipeline is unaffected; only `peaky mcp` errors.
mcp = ["mcp>=1.2"]
# Back-compat: `mascope-peaky[local-scoring]` used to pull in the (then-optional)
# local backend. It is now a core dependency, so this extra is a harmless no-op.
local-scoring = []

[project.urls]
Repository = "https://github.com/ultra-trace-systems/peaky"

[project.scripts]
peaky = "peaky.cli:main"
mascope-assign = "peaky.cli:main"   # back-compat alias

[tool.hatch.build.targets.wheel]
# `peaky` is the package; `mascope_assign` is a one-line back-compat shim
# (sys.modules alias) so existing `import mascope_assign` keeps working.
packages = ["peaky", "mascope_assign"]
